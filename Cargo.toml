[package]
name = "busbar-admin"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "A human-facing CLI for the busbar gateway's admin API (/api/v1/admin)."
repository = "https://github.com/GetBusbar/busbar-admin"
readme = "README.md"
keywords = ["busbar", "llm", "gateway", "admin", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "busbar-admin"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"

[profile.release]
strip = true
lto = true
